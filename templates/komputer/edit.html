{% extends 'base.html' %}

{% block title %}Edit Komputer - NetGaming Admin{% endblock %}
{% block header_title %}Edit Data Komputer{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 col-sm-12">
        <div class="card card-custom">
            <div class="card-header">
                <h5 class="m-0 fw-bold">Form Edit Komputer</h5>
            </div>
            <div class="card-body">
                <form action="{{ url_for('komputer.edit', id=komputer.id) }}" method="POST">
                    <div class="mb-3">
                        <label for="nomor_pc" class="form-label fw-medium">Nomor PC</label>
                        <input type="text" class="form-control" id="nomor_pc" name="nomor_pc" value="{{ komputer.nomor_pc }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="nama_pc" class="form-label fw-medium">Nama PC</label>
                        <input type="text" class="form-control" id="nama_pc" name="nama_pc" value="{{ komputer.nama_pc }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="spesifikasi" class="form-label fw-medium">Spesifikasi Detail</label>
                        <input type="text" class="form-control" id="spesifikasi" name="spesifikasi" value="{{ komputer.spesifikasi }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="status" class="form-label fw-medium">Status Komputer</label>
                        <select class="form-select" id="status" name="status" required>
                            <option value="Tersedia" {% if komputer.status == 'Tersedia' %}selected{% endif %}>Tersedia</option>
                            <option value="Digunakan" {% if komputer.status == 'Digunakan' %}selected{% endif %}>Digunakan</option>
                        </select>
                    </div>
                    <div class="d-flex justify-content-between mt-4">
                        <a href="{{ url_for('komputer.index') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Kembali</a>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Perbarui</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

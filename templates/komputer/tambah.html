{% extends 'base.html' %}

{% block title %}Tambah Komputer - NetGaming Admin{% endblock %}
{% block header_title %}Tambah Komputer Baru{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 col-sm-12">
        <div class="card card-custom">
            <div class="card-header">
                <h5 class="m-0 fw-bold">Form Komputer Baru</h5>
            </div>
            <div class="card-body">
                <form action="{{ url_for('komputer.tambah') }}" method="POST">
                    <div class="mb-3">
                        <label for="nomor_pc" class="form-label fw-medium">Nomor PC</label>
                        <input type="text" class="form-control" id="nomor_pc" name="nomor_pc" placeholder="Contoh: PC-06" required>
                    </div>
                    <div class="mb-3">
                        <label for="nama_pc" class="form-label fw-medium">Nama PC</label>
                        <input type="text" class="form-control" id="nama_pc" name="nama_pc" placeholder="Contoh: Gaming PC Elite 3" required>
                    </div>
                    <div class="mb-3">
                        <label for="spesifikasi" class="form-label fw-medium">Spesifikasi Detail</label>
                        <input type="text" class="form-control" id="spesifikasi" name="spesifikasi" placeholder="Contoh: RTX 4060, Ryzen 5, 16GB RAM, 165Hz" required>
                    </div>
                    <div class="d-flex justify-content-between mt-4">
                        <a href="{{ url_for('komputer.index') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Kembali</a>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Simpan</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

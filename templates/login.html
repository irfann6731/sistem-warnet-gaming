<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - NetGaming Cafe</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <style>
        body {
            background-color: #f8fafc;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .login-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.03);
            text-align: center;
        }

        .brand-logo {
            font-size: 2rem;
            font-weight: 800;
            color: #0d6efd;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .brand-logo i {
            font-size: 2.2rem;
        }

        .login-title {
            font-size: 1.1rem;
            color: #64748b;
            font-weight: 500;
            margin-bottom: 32px;
        }

        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #334155;
            text-align: left;
            display: block;
            margin-bottom: 6px;
        }

        .form-control {
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.1);
        }

        .btn-login {
            background-color: #0d6efd;
            border: none;
            color: #ffffff;
            font-weight: 700;
            padding: 14px;
            border-radius: 12px;
            width: 100%;
            font-size: 1rem;
            margin-top: 10px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.15);
        }

        .btn-login:hover {
            background-color: #0b5ed7;
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(13, 110, 253, 0.25);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .error-alert {
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-align: left;
        }

        .back-home-link {
            display: inline-block;
            margin-top: 24px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #64748b;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .back-home-link:hover {
            color: #0d6efd;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-logo">
            <i class="bi bi-controller"></i> NetGaming
        </div>
        <div class="login-title">Dashboard Admin Portal</div>

        {% if error %}
        <div class="error-alert">
            <i class="bi bi-exclamation-triangle-fill fs-6"></i>
            <div>{{ error }}</div>
        </div>
        {% endif %}

        <form action="{{ url_for('dashboard.login') }}" method="POST">
            <div class="mb-3 text-start">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="Masukkan username" required autofocus autocomplete="off">
            </div>
            
            <div class="mb-4 text-start">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Masukkan password" required>
            </div>

            <button type="submit" class="btn btn-login">
                <i class="bi bi-box-arrow-in-right me-2"></i> Masuk Ke Sistem
            </button>
        </form>

        <a href="{{ url_for('dashboard.landing') }}" class="back-home-link">
            <i class="bi bi-arrow-left me-1"></i> Kembali ke Halaman Utama
        </a>
    </div>

</body>
</html>

{% extends 'base.html' %}

{% block title %}Edit Pelanggan - NetGaming Admin{% endblock %}
{% block header_title %}Edit Data Pelanggan{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 col-sm-12">
        <div class="card card-custom">
            <div class="card-header">
                <h5 class="m-0 fw-bold">Form Edit Pelanggan</h5>
            </div>
            <div class="card-body">
                <form action="{{ url_for('pelanggan.edit', id=pelanggan.id) }}" method="POST">
                    <div class="mb-3">
                        <label for="nama_pelanggan" class="form-label fw-medium">Nama Pelanggan</label>
                        <input type="text" class="form-control" id="nama_pelanggan" name="nama_pelanggan" value="{{ pelanggan.nama_pelanggan }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="nomor_pelanggan" class="form-label fw-medium">Nomor Pelanggan</label>
                        <input type="text" class="form-control" id="nomor_pelanggan" name="nomor_pelanggan" value="{{ pelanggan.nomor_pelanggan }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="jenis_pelanggan" class="form-label fw-medium">Jenis Pelanggan</label>
                        <select class="form-select" id="jenis_pelanggan" name="jenis_pelanggan" required>
                            <option value="Biasa" {% if pelanggan.jenis_pelanggan == 'Biasa' %}selected{% endif %}>Pelanggan Biasa</option>
                            <option value="Member" {% if pelanggan.jenis_pelanggan == 'Member' %}selected{% endif %}>Member</option>
                        </select>
                    </div>
                    <div class="d-flex justify-content-between mt-4">
                        <a href="{{ url_for('pelanggan.index') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Kembali</a>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Perbarui</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

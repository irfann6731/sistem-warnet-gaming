{% extends 'base.html' %}

{% block title %}Tambah Pelanggan - NetGaming Admin{% endblock %}
{% block header_title %}Tambah Pelanggan Baru{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 col-sm-12">
        <div class="card card-custom">
            <div class="card-header">
                <h5 class="m-0 fw-bold">Form Pelanggan Baru</h5>
            </div>
            <div class="card-body">
                <form action="{{ url_for('pelanggan.tambah') }}" method="POST">
                    <div class="mb-3">
                        <label for="nama_pelanggan" class="form-label fw-medium">Nama Pelanggan</label>
                        <input type="text" class="form-control" id="nama_pelanggan" name="nama_pelanggan" placeholder="Contoh: Ahmad Dhani" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="nomor_pelanggan" class="form-label fw-medium">Nomor Pelanggan</label>
                        <input type="text" class="form-control fw-bold text-primary" id="nomor_pelanggan" name="nomor_pelanggan" value="{{ next_nomor_pelanggan }}" required readonly style="background-color: #f8f9fa;">
                    </div>
                    <div class="mb-3">
                        <label for="jenis_pelanggan" class="form-label fw-medium">Jenis Pelanggan</label>
                        <select class="form-select" id="jenis_pelanggan" name="jenis_pelanggan" required>
                            <option value="Biasa">Pelanggan Biasa</option>
                            <option value="Member">Member</option>
                        </select>
                    </div>
                    <div class="d-flex justify-content-between mt-4">
                        <a href="{{ url_for('pelanggan.index') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Kembali</a>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Simpan</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
